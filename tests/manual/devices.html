<!doctype html><html><head><meta charset="utf-8"><title>TRAPBOUND responsive QA</title><style>body{margin:0;background:#222;color:#eee;font:14px system-ui}nav{padding:8px;position:sticky;top:0;z-index:10;background:#222;display:flex;gap:8px}button{padding:8px}iframe{display:block;border:0;margin:auto}#canvas{width:max-content;min-width:100vw}label{margin-left:auto}</style></head><body><nav><button data-size="1366,900">Desktop</button><button data-size="820,1180">iPad portrait</button><button data-size="1180,820">iPad landscape</button><button data-size="1024,768">Tablet landscape</button><button data-size="393,852">Mobile portrait</button><button data-size="852,393">Mobile landscape</button><select aria-label="Test scene" id="scene"><option value="/">Live game</option><option value="run">Run fixture</option><option value="spectate">Spectate fixture</option><option value="realm">Monster Realm fixture</option><option value="duel">Rival Realm fixture</option></select><button id="refreshCss">Refresh styles</button><label id="size"></label></nav><div id="canvas"><iframe title="TRAPBOUND test viewport" src="/" width="820" height="1180"></iframe></div><script>for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.width=w;f.height=h;document.querySelector('#size').textContent=w+' × '+h};document.querySelector('#refreshCss').onclick=()=>{const d=document.querySelector('iframe').contentDocument;for(const l of d.querySelectorAll('link[rel=stylesheet]'))l.href=l.href.split('?')[0]+'?qa='+Date.now()};document.querySelector('#scene').onchange=e=>{document.querySelector('iframe').src=e.target.value==='/'?'/':'/__qa/frozen?scene='+e.target.value};</script></body></html>
